# ==========================================================================
# 🚀 LemGendary Training Suite - NUCLEAR v16.0 CONFIGURATION
# ==========================================================================

# Core Manifold Version
version: "16.0.0-nuclear"
unified_models: "unified_models_v2.yaml"

# --- Hardware Profiles (Task 12.4) ---
# Optimized for sequential SOTA training on restricted hardware.
hardware:
  target_device: "cuda"
  vram_limit_gb: 4.0
  num_workers: 0 # Forced to 0 for stability on 4GB VRAM
  pin_memory: true
  use_fp16: true

# --- Smart Governor Tuning (Task 12.2) ---
governor:
  emergency_breakout_threshold: 0.10 # 10% quality drop shatters the lock
  jolt_cooldown_epochs: 5
  sharpening_cooling_rate: 0.98
  min_softmax_temp: 0.1
  stabilization_lock_epochs: 3
  logit_clamp: 10.0

# --- Fleet & Synchronization (Task 12.3) ---
fleet:
  auto_sync: true
  inter_model_cooldown_seconds: 2
  retry_attempts: 3
  model_hub_repo: "https://github.com/lemgenda/lemgendary-pretrained-models.git"
  failure_log: "fleet_failure_report.json"

# --- Orchestration Paths ---
paths:
  datasets_root: "../LemGendaryDatasets"
  checkpoints_root: "checkpoints"
  export_root: "../LemGendaryModels"

# --- Training Defaults ---
defaults:
  img_size: 256
  batch_size: 8 # Optimized for 384px at 4GB VRAM
  lr: 0.00025
  epochs: 1000
  patience: 250

# --- Security & Stealth ---
security:
  mask_tokens: true
  stealth_mode: true

# --- Execution Matrix ---
execution:
  mode: "training" # choices: ["training", "single_epoch_test", "vetting"]
  suffixes:
    training: "Large"
    single_epoch_test: "KaggleReady"
