---
# ==========================================================================
# [LAUNCH] LemGendary Training Suite - NUCLEAR v16.0 CONFIGURATION
# ==========================================================================

# The suite version lives only in pyproject.toml ([project] version).
unified_models: "unified_models_v2.yaml"

# --- Hardware Profiles (Task 12.4) ---
# Optimized for sequential SOTA training on restricted hardware.
hardware:
  target_device: "cuda"
  # cudnn_workspace_cap_train and cudnn_workspace_cap_val are intentionally unset.
  # audit_hardware_vram() computes VRAM-tier-aware dynamic caps at runtime:
  #   <4.5GB VRAM (GTX 1650):  val_cap=4,  train_cap=16
  #   <8.5GB VRAM (RTX 3060):  val_cap=12, train_cap=16
  #   <16.5GB VRAM (RTX 3090): val_cap=24, train_cap=32
  #   >=16.5GB VRAM (A100/T4x2): val_cap=48, train_cap=64
  # Override here ONLY if you need to force a specific cap on this machine.
  # cudnn_workspace_cap_val: 4
  # cudnn_workspace_cap_train: 16
  # directml_assumed_free_gb: 2.0  # DirectML free memory override. Unset (default): the
  #   DXGI per-process budget minus usage (integrated GPUs capped by host RAM), else 0.8 x
  #   dedicated VRAM, else 2.0 GB (training/hardware/device_memory.py). Set wins over all.
  enable_expandable_segments: true
  num_workers: auto  # Dynamically managed by train.py: 0 on Windows, 4 on Kaggle/Colab
  val_num_workers: auto  # Independent validation workers: 0 on Windows, 1-2 on Kaggle/Colab
  pin_memory: true
  use_fp16: true

# --- Smart Governor Tuning (Task 12.2) ---
governor:
  # --- 2026 Dynamic Manifold Schema (v17.0) ---
  manifold:
    resolution_stride: 128       # Universal rung increment (px)
    max_resolution: 1024         # Hard ceiling for resolution scaling
    initial_fraction: 0.15       # Default starting data variety
    fraction_increment: 0.20     # Expansion step size
    maturity_soak: 5             # Mandatory epochs per rung (Universal)
    plateau_patience: 6          # Epochs to wait before next rung jump

  emergency_breakout_threshold: 0.10  # 10% quality drop shatters the lock
  jolt_cooldown_epochs: 5
  sharpening_cooling_rate: 0.98
  stabilization_lock_epochs: 3
  logit_clamp: 10.0
  # Resume of face and synthesis models: a restored best quality above `above` is the
  # artificial anchor of older runs and is reset to `reset_to` (review D-15).
  # Remove the section to keep restored values unchanged.
  quality_anchor_recalibration:
    above: 600.0
    reset_to: 555.0

# --- Kaggle session deadline (training/cloud/session_deadline.py) ---
# A Kaggle session ends after limit_hours. Training stops margin_minutes earlier,
# saves progress.pth (generator states included), syncs pytorch/default to the Hub
# and writes LemGendaryModels/<model>/session_deadline.json. auto_resume lets the
# GUI job push a new kernel version after such a stop (at most max_resumes times).
kaggle_session:
  limit_hours: 12
  margin_minutes: 30
  auto_resume: false
  max_resumes: 3

# --- Fleet & Synchronization (Task 12.3) ---
fleet:
  auto_sync: true
  # Per-epoch Kaggle auto-sync throttle (training/cloud/sync_policy.py): upload the
  # isolated pytorch/default payload every N epochs (0: never on cadence) and on a
  # new best epoch. The final sync at the end of a run always uploads.
  kaggle_sync_every_epochs: 5
  kaggle_sync_on_best: true
  force_kaggle_sync: false  # Trigger Kaggle Model upload even on local machine
  retry_attempts: 3
  model_hub_repo: "https://github.com/lemgenda/lemgendary-pretrained-models.git"
  failure_log: "fleet_failure_report.json"
  google_drive_folder_id: "142G7B9ONfUkXAhVkPeN4NeJ3YXU0UmJX"
  google_drive_folder_url: "https://drive.google.com/drive/folders/142G7B9ONfUkXAhVkPeN4NeJ3YXU0UmJX?usp=drive_link"
  google_drive_sync: true
  google_drive_token_file: ".GOOGLE_DRIVE"
  # Seconds a finished or interrupted run waits at exit for pending background
  # uploads before abandoning them (logged); see training/cloud/sync_threads.py.
  sync_exit_timeout_sec: 300

# --- Orchestration Paths ---
# The models hub (LemGendaryModels) has one resolver, training.utils.paths.
# get_models_hub_root: LEMGENDARY_WORKSPACE_ROOT (set by the Kaggle notebook to the
# kernel output) or the suite's parent folder. paths.checkpoints_root / export_root
# override it only when set here.
paths:
  datasets_root: "../LemGendaryDatasets"

# --- Training Defaults ---
defaults:
  img_size: auto
  batch_size: auto  # Dynamic Hardware Audit enabled (Iron-Clamp v22.0)
  lr: 0.00025
  epochs: 300
  patience: 100

# --- Epoch Budget Governance (TS D-01) ---
# The epoch budget (--epochs, model `epochs`, or defaults.epochs) is a hard cap.
# Training also stops when the governor signals early stop or all completion
# criteria are met. Budget extensions are opt-in: when the budget is spent and
# the governor still reports improvement, add `extension_epochs` at a time, up
# to `max_extension_epochs` in total. max_extension_epochs: 0 disables them.
training_budget:
  extension_epochs: 10
  max_extension_epochs: 0

# --- Stochastic Weight Averaging (torch.optim.swa_utils) ---
# Off by default. When enabled, the weights of every `update_every`-th epoch
# from `start_epoch` (or after `start_fraction` of the budget) are averaged.
# `swa_lr` hands the LR to SWALR (null keeps the main scheduler). BatchNorm
# statistics are refreshed before the averaged model is validated and saved
# as vault_swa.pth, a Pareto Model Soup ingredient (`eval_every` updates;
# 0 = only at the end). Resume state lives in checkpoints/swa_state.pth.
swa:
  enabled: false
  start_epoch: null
  start_fraction: 0.75
  swa_lr: null
  anneal_epochs: 5
  anneal_strategy: cos
  update_every: 1
  eval_every: 0
  bn_update_batches: null

# --- Shard Locality (training/data/locality.py) ---
# On by default (owner decision; defaults in training/data/locality.py).
# `window_shards`: the train sampler shuffles the shards each epoch and the
# samples inside windows of this many shards, so workers read a few
# WebDataset shards at a time (page cache, readahead) instead of seeking
# across all of them; 4 x 1 GB shards fit a Kaggle/Colab page cache.
# `fraction_block_size`: a curriculum fraction takes shuffled contiguous
# blocks of this many samples inside each shard instead of single samples;
# 256 samples are one 25-75 MB sequential read and a shard still splits into
# 12-40 blocks. 0 turns either off. Both stay deterministic, resumable and
# nested. A resumed run finishes the interrupted epoch on the settings recorded
# in its checkpoint and takes over changed ones from the next epoch
# (training/run_settings, logged to settings_changes.jsonl).
data:
  locality:
    window_shards: 4
    fraction_block_size: 256

# --- Execution Matrix ---
execution:
  mode: "training"  # choices: ["training", "single_epoch_test", "vetting"]
  suffixes:
    training: "Large"
    single_epoch_test: "Large"
