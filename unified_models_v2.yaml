_registry_metadata:
  version: 2.2.0
  specialization: 2026_Resiliency
nima_aesthetic_mobile:
  name: LemGendary NIMA Aesthetic Scorer (Mobile)
  class_name: NIMA_Model
  category: enhance
  filename: NIMAAestheticMobile
  checkpoint: NIMAAestheticMobileWeights_FP32.pth
  input_size:
  - 3
  - 224
  - 224
  batch_size: auto
  learning_rate: 5.0e-05
  loss_fn: emd
  dataset_type: quality
  optimal_key: nima_aesthetic_mobile
  architecture_type: MobileNetV2 (Global Composition)
  description: Aesthetic quality scorer trained on custom standardized LemGendizedQualityDataset,
    optimized for artistic composition and color harmony.
  datasets:
  - LemGendizedNimaAesthetic
  sota_targets:
    plcc: 0.65
    srcc: 0.65
  stabilizers:
    softmax_temp: 1.0
    emd_epsilon: 0.0001
    logit_clamp: 15.0
    rank_weight: 0.8
    rank_margin: 0.1
    numerical_sentinel:
    - -15.0
    - 15.0
  optimization:
    enabled: true
    fraction_increment: 0.1
    plateau_patience: 8
    cooling_factor: 0.85
    plateau_priority: data
    res_ladder:
    - 224
    clamp_range:
    - 15.0
    - 45.0
    jolt_multiplier: 1.5
    target_effective_batch: 32
    min_delta: 0.001
    swa_start_pct: 0.65
  val_resolution: 224
