forex_predictor:
  name: LemGendary Forex Predictor (Multi-Scale CNN-Transformer)
  class_name: ForexPredictor
  category: forex
  filename: ForexPredictor
  checkpoint: ForexPredictorWeights_FP32.pth
  input_size: null
  batch_size: auto
  learning_rate: 0.0001
  loss_fn: forex_dual
  dataset_type: forex
  optimal_key: forex_predictor
  architecture_type: Multi-Scale CNN-Transformer (Causal TCN + Cross-Timeframe Attention)
  description: 'Multi-pair, multi-timeframe Forex trading model trained on MetaTrader
    5 OHLCV data. Predicts trade direction (Up/Down/Sideways) and magnitude (TP/SL
    pips) for all major currency pairs. Architecture uses causal Conv1D stacks per
    timeframe fused via cross-timeframe attention. Fully stateless and ONNX-compatible
    for live MT5 EA deployment.

    '
  datasets:
  - LemGendizedForexUniverseLarge
  kaggle_ref: kaggle://lemtreursi/lemgendizedforexuniverselarge
  kaggle_dataset_urls:
  - https://www.kaggle.com/datasets/lemtreursi/lemgendizedforexuniverselarge
  curriculum:
    active_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
  google_drive_dataset_ids: []
  kwargs:
    active_timeframes:
    - 1
    - 5
    - 15
    - 60
    - 240
    - 1440
    pairs:
    - EURUSD
    - GBPUSD
    - USDJPY
    - XAUUSD
    - USDCAD
    - USDCHF
    - AUDUSD
    - NZDUSD
    - EURJPY
    - GBPJPY
    - EURGBP
    - XAGUSD
    - USOIL
    - US500
    - NAS100
    - DE40
    d_model: 192
    n_heads: 6
    n_layers: 4
    head_hidden: 384
    in_features: 14
    dropout: 0.1
  sota_targets:
    dir_acc: 58.5
    win_rate: 56.0
    profit_factor: 1.65
    sharpe_ratio: 1.85
    sortino_ratio: 2.1
    max_drawdown: 12.0
    tp_mae: 12.5
    sl_mae: 12.5
  stabilizers:
    softmax_temp: 1.0
    min_temp: 0.75
    numerical_sentinel:
    - -50.0
    - 50.0
  optimization:
    enabled: true
    initial_fraction: 0.15
    fraction_increment: 0.15
    absolute_patience: 30
    plateau_patience: 12
    cooling_factor: 0.85
    plateau_priority: data
    drift_gate: 0.9
    regression_limit: 8
    high_fidelity_fraction: 0.6
    res_ladder:
    - 1
    - 5
    - 15
    - 60
    - 240
    - 1440
    jolt_multiplier: 1.15
    target_effective_batch: 64
    min_delta: 0.002
    swa_start_pct: 0.7
  val_resolution: null
  kaggle_accelerator: T4
