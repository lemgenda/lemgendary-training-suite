[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemgendary-training-suite"
version = "16.9.126"
description = "Industrial-grade Deep Learning Training Suite for Vision, Restoration, and Financial Time-Series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "torchmetrics>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pillow>=9.5.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "einops>=0.7.0",
    "timm>=0.9.0",
    "requests>=2.31.0",
    "albumentations>=1.3.0",
    "onnx>=1.15.0",
    "websockets>=12.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "webdataset>=0.2.0",
    "litdata>=0.2.0",
    "zstandard>=0.21.0"
]

[project.scripts]
lemtrain = "training.cli.lemtrain:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "models*", "data*", "export*"]

[tool.pyright]
include = ["training", "models", "data", "export"]
exclude = ["**/__pycache__", ".venv", "tmp", "checkpoints"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py310"
