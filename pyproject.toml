[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemgendary-training-suite"
version = "2.3.0"
description = "Industrial-grade Deep Learning Training Suite for Vision, Restoration, and Financial Time-Series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pillow>=9.5.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0"
]

[project.scripts]
lemtrain = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "models*", "data*", "export*"]

[tool.pyright]
include = ["training", "models", "data", "export"]
exclude = ["**/__pycache__", ".venv", "tmp", "checkpoints"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
